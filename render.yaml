# Render Blueprint for DataLens: one web service + one PostgreSQL database.
# In Render: New + > Blueprint > pick this repo. Render asks you for the two
# secrets marked "sync: false" (GROQ_API_KEY and INITIAL_ADMIN_PASSWORD).
services:
  - type: web
    name: datalens
    runtime: python
    plan: starter            # a persistent disk needs a paid plan; see notes in the guide
    buildCommand: pip install -r requirements.txt
    # 1 worker + threads: the app keeps a parsed-dataset cache and creates tables at start-up,
    # and the instance is small. --timeout is long because AI reports and model training are slow.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    disk:
      name: datalens-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATALENS_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: datalens-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/private_uploads
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ASSISTANT_MODELS
        value: openai/gpt-oss-20b,openai/gpt-oss-120b
      - key: PUBLIC_BASE_URL
        sync: false          # your https://<service>.onrender.com address, or your custom domain
      - key: INITIAL_ADMIN_USERNAME
        value: peace
      - key: INITIAL_ADMIN_EMAIL
        value: muhammedtesleemolatundun@gmail.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false          # enter it in the Render dashboard; never commit it

databases:
  - name: datalens-db
    plan: free               # free databases expire after a trial period; upgrade for real use
    databaseName: datalens
    user: datalens
